[project]
name = "networksecurity"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Bhanutej73", email = "bhanutej930@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "certifi>=2026.7.22",
    "dagshub>=0.7.3",
    "dill>=0.4.1",
    "fastapi>=0.143.0",
    "mlflow>=3.17.1",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pymongo>=4.18.1",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.7.2",
    "setuptools>=84.0.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
networksecurity = "networksecurity:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
